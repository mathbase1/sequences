add('linear_reasoning',3,'membership-before-first-position',['membership','off_by_one'],({r,v})=>{const d=ri(r,2,7),c=ri(r,3,15),zero=ri(r,0,3),term=c-d*zero;return choice(v,'score',`Does ${term} occur at a valid position in this sequence?`,'No: the rule would need a position of 0 or less',[opt('Yes: any solution of the equation is a sequence position','Sequence positions here must be positive whole numbers starting at 1.','membership'),opt('Yes: treat it as the first term','The first term is found using n = 1, not an earlier index.','off_by_one'),opt('No: negative term values are never allowed','A sequence can have negative values. The issue is the position required by this rule.','membership')],['linear-membership',d,c,term],{expression:'nth term = '+linear(d,c),steps:[`${d}n = ${term} − ${c} = ${-d*zero}.`,`The equation gives n = ${-zero}.`,`Positions begin at 1, so that position is not part of the sequence.`],hint:'A whole-number answer is not enough: the position must also be at least 1.',rule:'Valid positions in this activity are 1, 2, 3, and so on.'});});
add('linear_reasoning',3,'position-with-fractional-step',['membership','nth_multiplier'],({r,v})=>{const d=pick(r,[.5,.75,1.25,1.5]),c=pick(r,[-3,-1,2,4]),p=ri(r,8,20),term=d*p+c;return number(v,'measure',`Which position has the marked value ${n(term)} mm?`,p,['linear-position',d,c,n(term)],{unit:'',unitAliases:[],expression:'nth term = '+linear(d,c),steps:[`Remove the constant: ${n(term)} − (${n(c)}) = ${n(d*p)}.`,`Divide by the fractional step: ${n(d*p)} ÷ ${n(d)} = ${p}.`,`The position is ${p}, a positive whole number.`],hint:'Undo the constant, then divide by the full fractional coefficient.',rule:'Fractional term values can still occur at whole-number positions.',misconceptions:[bad(n(d*p*d),'The fractional coefficient must be divided out, not multiplied again.','nth_multiplier'),bad(n(term),'The measured term value is not the requested position.','term_position')]});});

 const eq=rhs.indexOf('=');if(eq>=0){prefix=rhs.slice(0,eq+1)+' ';rhs=rhs.slice(eq+1).trim();}

 const strip=t=>{t=t.trim();if(t.startsWith('(')&&t.endsWith(')')){let d=0;for(let i=0;i<t.length;i++){if(t[i]==='(')d++;if(t[i]===')')d--;if(d===0&&i<t.length-1)return t;}return t.slice(1,-1);}return t;};

const glossary=[
{word:'Sequence',definition:'An ordered list of numbers or objects. The order matters.',example:'4, 7, 10, 13, …',note:'This sequence starts at 4 and goes up by 3 each time.'},
{word:'Term',definition:'One value in a sequence.',example:'4, 7, 10, 13, …',note:'The first term is 4. The third term is 10. A term is a value; its position tells you where it is.'},
{word:'Position',definition:'Where a term is in a sequence, counted from the start.',example:'1st, 2nd, 3rd, 4th, …',note:'In this activity, positions begin at 1. The value of the first term does not have to be 1.'},
{word:'n',definition:'The position number in an nth-term rule.',example:'nth term = 3n + 1',note:'For the fifth term, use n = 5: 3 × 5 + 1 = 16. n is the position, not the previous term.'},
{word:'nth term',definition:'A rule that gives the value of a term directly from its position n.',example:'nth term = 3n + 1',note:'This gives 4, 7, 10, 13, … when n is 1, 2, 3, 4, …'},
{word:'Term-to-term rule',definition:'Tells you how to get from the known term or terms to the next term.',example:'Start at 4; add 3 each time.',note:'This gives 4, 7, 10, 13, … An nth-term rule instead starts with the position.'},
{word:'Position-to-term rule',definition:'Another name for an nth-term rule. It connects a position to its term.',example:'Multiply the position by 3, then add 1.',note:'At position 4, the term is 3 × 4 + 1 = 13.'},
{word:'Common difference',definition:'The same amount added or subtracted between consecutive terms of an arithmetic sequence.',example:'15, 11, 7, 3, …',note:'11 − 15 = −4. The common difference is −4, meaning subtract 4 each time.'},
{word:'Linear sequence',definition:'A sequence with a constant difference between consecutive terms. It is also called an arithmetic sequence.',example:'5, 9, 13, 17, …',note:'The difference is 4. Compare with 4n: 4, 8, 12, 16, … Each term is 1 more, so the nth term is 4n + 1.'},
{word:'Increasing',definition:'The terms get larger as you move through the sequence.',example:'2, 5, 8, 11, …',note:'The difference is positive: add 3.'},
{word:'Decreasing',definition:'The terms get smaller as you move through the sequence.',example:'12, 9, 6, 3, …',note:'The difference is negative: subtract 3. Its nth-term rule is 15 − 3n.'},
{word:'Consecutive',definition:'Following directly after one another, without a gap.',example:'The 3rd, 4th and 5th terms',note:'The 3rd and 7th terms are four steps apart, not one step apart.'},
{word:'Substitute',definition:'Replace a letter with the value given, then calculate.',example:'nth term = 4n − 1; find the 6th term.',note:'Replace n with 6: 4 × 6 − 1 = 23.'},
{word:'Coefficient',definition:'The number multiplying a letter.',example:'4n + 1',note:'The coefficient of n is 4. For a linear sequence, it is the common difference.'},
{word:'Constant',definition:'A fixed number in the rule that does not change with n.',example:'4n + 1',note:'The constant is +1. It is not the first term: at n = 1, the first term is 5.'},
{word:'Geometric sequence',definition:'Each term is made by multiplying the previous term by the same number.',example:'3, 6, 12, 24, …',note:'Multiply by 2 each time. The difference changes, but the multiplying factor stays the same.'},
{word:'Common ratio',definition:'The fixed multiplying factor in a geometric sequence.',example:'20, 10, 5, 2.5, …',note:'The common ratio is 1/2: multiply by one half, or divide by 2.'},
{word:'Square number',definition:'The result of multiplying a whole number by itself.',example:'1, 4, 9, 16, 25, …',note:'These are 1², 2², 3², 4², 5², … The differences are not constant.'},
{word:'Cube number',definition:'The result of multiplying three copies of the same whole number.',example:'1, 8, 27, 64, 125, …',note:'These are 1³, 2³, 3³, 4³, 5³, … For example, 3³ = 3 × 3 × 3 = 27.'},
{word:'Triangular number',definition:'A total made by adding consecutive positive whole numbers from 1.',example:'1, 3, 6, 10, 15, …',note:'For example, the fourth triangular number is 1 + 2 + 3 + 4 = 10.'},
{word:'Fibonacci-type sequence',definition:'After two starting terms, add the previous two terms to get the next one.',example:'2, 3, 5, 8, 13, …',note:'2 + 3 = 5, then 3 + 5 = 8, then 5 + 8 = 13. Keep using the latest two terms.'},
{word:'Quadratic sequence',definition:'A sequence whose second differences are constant and non-zero.',example:'2, 5, 10, 17, 26, …',note:'The first differences are 3, 5, 7, 9; the second differences are all 2. Continue the difference pattern. You are not asked to derive a quadratic nth-term formula here.'},
{word:'First difference',definition:'The change from one term to the next: later term minus earlier term.',example:'4, 9, 16, 25',note:'The first differences are 9 − 4 = 5, 16 − 9 = 7, and 25 − 16 = 9.'},
{word:'Second difference',definition:'The change between consecutive first differences.',example:'First differences: 5, 7, 9',note:'The second differences are 7 − 5 = 2 and 9 − 7 = 2.'},

{word:'Whole number',definition:'A number such as 0, 1, 2 or 3 with no fractional part.',example:'Positions: 1, 2, 3, …',note:'Sequence positions here are positive whole numbers. If a calculation gives position 4.5, that value is not a term of the sequence.'}
];

function sequencePanel(q){
 if(!Array.isArray(q.sequence)||!q.sequence.length)return '';
 return '<section class="sequence-panel" aria-label="Sequence"><p class="sequence-label">'+esc(q.sequenceLabel||'The sequence')+'</p><ol class="sequence-values">'+q.sequence.map(v=>'<li class="sequence-token '+(v===null?'missing-term':'')+'">'+(v===null?'<span aria-label="missing term">?</span>':math(v))+'</li>').join('')+'</ol></section>';
}
function patternPanel(q){
 const diagram=q.diagram;
 const groups=diagram?.patterns||diagram?.counts?.map((count,i)=>({count,position:i+1,caption:diagram.captions?.[i]||'Pattern '+(i+1),columns:diagram.columns||5}))||q.visualGroups;
 if(!groups?.length)return '';
 const tiles=count=>Array.from({length:Math.min(80,Math.max(0,count))},()=>'<span class="pattern-tile"></span>').join('');
 return '<div class="pattern-panel" aria-label="Growing pattern">'+groups.map((g,i)=>{
 const caption=diagram?.captions?.[i]||g.caption||'Pattern '+g.position;
 const content=Number.isInteger(g.groups)?'<div class="tile-clusters">'+Array.from({length:g.groups},()=>'<span class="tile-cluster" style="--tile-columns:'+Math.min(6,g.groupSize)+'">'+tiles(g.groupSize)+'</span>').join('')+(g.fixed?'<span class="tile-cluster fixed-cluster" style="--tile-columns:'+Math.min(6,g.fixed)+'">'+tiles(g.fixed)+'</span>':'')+'</div>':'<div class="tile-grid" style="--tile-columns:'+Math.max(1,Math.min(10,g.columns||5))+'">'+tiles(g.count)+'</div>';
 return '<figure class="pattern-figure"><div role="img" aria-label="'+esc(caption+', '+g.count+' squares'+(Number.isInteger(g.groups)?', '+g.groups+(g.groups===1?' group of ':' groups of ')+g.groupSize+(g.fixed?', plus '+g.fixed+(g.fixed===1?' fixed square':' fixed squares'):''):''))+'">'+content+'</div><figcaption>'+esc(caption)+'</figcaption></figure>';
 }).join('')+'</div>';
}
function scalarAnswer(q,locked){
 const expression=q.kind==='expression';
 const keys=expression?['n','+','−','(',')','/']:['−','.','/'];
 return '<label class="answer-label" for="expression-answer">'+(expression?'Your nth-term rule':'Your numerical answer')+(q.unit?' <span class="answer-unit-label">('+rich(q.unit)+')</span>':'')+'</label><div class="number-answer-row"><input class="answer-input" id="expression-answer" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" inputmode="'+(expression?'text':'decimal')+'" placeholder="'+(expression?'Type a rule using n':'Type your answer')+'" maxlength="240" aria-describedby="input-help" value="'+esc(draft||(locked?entryResponse(history().at(-1)||{}):''))+'" '+(locked?'disabled':'')+'>'+(q.unit?'<span class="answer-unit '+(q.unit==='£'?'currency':'')+'" aria-hidden="true">'+rich(q.unit)+'</span>':'')+'</div><p class="input-help" id="input-help">'+(expression?'Use n for the position, starting at 1. Equivalent expressions are accepted.':'Give the final value. Equivalent fractions and decimals are accepted; 17 and 17.00 mean the same.')+'</p>'+(!locked?'<div class="keys" aria-label="Answer entry helpers">'+keys.map(k=>'<button type="button" class="key" data-insert="'+esc(k)+'" aria-label="Insert '+(k==='−'?'minus':k==='/'?'fraction slash':k==='.'?'decimal point':k)+'">'+esc(k)+'</button>').join('')+'</div>':'');
}
function practice(){
 const q=state?.current;
 if(!q)return '<main id="main" class="workspace"><div class="end-card"><p class="eyebrow">Practice complete</p><h1>You have reached the end of this practice record.</h1><p>'+esc(state?.stopReason||'Review your progress and save it before starting a fresh record.')+'</p><div class="panel-actions"><button class="button primary" data-action="progress">Review progress</button><button class="button secondary" data-action="reset">Start fresh</button></div></div>'+footer()+'</main>';
 const fb=state.currentFeedback,locked=!!fb;
 const selectedId=selected||(locked?history().at(-1)?.response:'')||'';
 const answerUI=q.kind==='table'?tableAnswer(q,locked):q.kind==='choice'?'<fieldset class="choices"><legend>Choose one answer.</legend>'+q.options.map((o,i)=>{
 const chosen=selectedId===o.id;let cls='choice'+(locked?' locked':'');if(locked&&o.id===q.correctId)cls+=' correct-choice';else if(locked&&chosen)cls+=' wrong-choice';
 return '<label class="'+cls+'"><input type="radio" name="choice" value="'+esc(o.id)+'" '+(chosen?'checked':'')+' '+(locked?'disabled':'')+'><span class="letter" aria-hidden="true">'+String.fromCharCode(65+i)+'</span><span class="choice-text">'+rich(o.text)+(locked&&o.id===q.correctId?'<span class="choice-outcome">Correct answer</span>':locked&&chosen?'<span class="choice-outcome">Your answer</span>':'')+'</span></label>';
 }).join('')+'</fieldset>':
 scalarAnswer(q,locked);
 return '<main id="main" class="workspace">'+alerts()+'<div class="practice-top"><div class="practice-top-left"><span class="course-tag">'+icon('course',16)+esc(vocationName(q.vocation||state.vocation))+'</span><span class="round-count">Question '+(history().length+(locked?0:1))+'</span></div><button class="text-btn" data-action="progress">'+icon('chart',16)+'Progress</button></div><div class="practice-grid"><article class="question-card '+(q.kind==='table'?'has-table':'')+'" aria-labelledby="question-heading"><form id="question-form" novalidate><div class="question-inner"><h1 id="question-heading" tabindex="-1">'+rich(q.prompt)+'</h1><p class="context">'+rich(q.context)+'</p>'+(q.expression?'<div class="math-panel" aria-label="Given sequence rule">'+math(q.expression)+'</div>':'')+sequencePanel(q)+patternPanel(q)+valueCards(q)+(q.variableNote?'<p class="variable-note">'+rich(q.variableNote)+'</p>':'')+answerUI+(hinted&&!locked?'<div class="hint-box" role="status"><strong>A helpful starting point</strong><br>'+rich(q.hint)+'</div>':'')+(invalid?'<p class="error-inline" role="alert">'+esc(invalid)+'</p>':'')+(!locked?'<div class="actions-row"><button type="button" class="hint-button" data-action="hint">'+icon('bulb',18)+(hinted?'Hint opened':'Help me start')+'</button><button class="button primary" type="submit">Check answer</button></div>':'')+'</div></form>'+(locked?feedback(q,fb):'')+'</article><aside class="practice-side" aria-label="Practice support"><section class="side-card route-card"><p class="side-overline">Your next step</p><h2>Practice that responds to you</h2><p class="route-text">'+esc((locked?fb.route:state.routeReason)||'Start with what the words mean, then build the pattern.')+'</p></section><section class="side-card"><h2>This practice</h2><div class="micro-stats"><div><span class="stat-value">'+history().length+'</span><span class="stat-label">checks completed</span></div><div><span class="stat-value">'+independentCount()+'</span><span class="stat-label">correct unaided</span></div></div><p>Every answer helps choose the next question. There is no time limit.</p><button class="hint-button" data-action="progress">See your progress</button></section><section class="side-card vocab-side"><h2>Words to know</h2><div class="vocab-links">'+relevantWords(q).map(w=>'<button class="word-link" data-word="'+esc(w)+'">'+esc(w)+'</button>').join('')+'</div><p class="side-tip">Check whether the question asks for a term, a position or a rule. Positions start at 1.</p></section></aside></div>'+footer()+'</main>';
}
function relevantWords(q){
 const aliases={'arithmetic':'Linear sequence','linear':'Linear sequence','difference':'Common difference','term-to-term':'Term-to-term rule','position-to-term':'Position-to-term rule','square':'Square number','cube':'Cube number','triangular':'Triangular number','fibonacci':'Fibonacci-type sequence','quadratic':'Quadratic sequence','geometric':'Geometric sequence','ratio':'Common ratio','nth':'nth term'};
 let ws=(q.words||[]).map(w=>{const name=aliases[String(w).toLowerCase()]||w;return glossary.find(g=>g.word.toLowerCase()===String(name).toLowerCase())?.word;}).filter(Boolean);
 const related={language:['Sequence','Term','Position','n'],steps:['Term-to-term rule','Common difference','Increasing','Decreasing'],missing:['Consecutive','Common difference','Term'],given_linear:['nth term','n','Substitute','Table of values'],linear_nth:['nth term','Common difference','Coefficient','Constant'],linear_reasoning:['nth term','Position','Whole number'],visual:['Sequence','Position','Common difference','nth term'],familiar:['Square number','Cube number','Triangular number'],fibonacci:['Fibonacci-type sequence','Term'],quadratic:['Quadratic sequence','First difference','Second difference'],geometric:['Geometric sequence','Common ratio','nth term']};
 if(q.skill!=='language'&&ws.every(w=>['Sequence','Term','Position'].includes(w)))ws=[];
 return [...new Set([...ws,...(related[q.skill]||['Sequence','Term','Position'])])].slice(0,4);
}
function feedback(q,fb){
 const correct=fb.correct===true||fb.status==='correct',supported=hinted||fb.wasHinted;
 const title=correct?(supported?'Correct — with support.':'That’s correct.'):(fb.status==='unfinished'?'A correct setup — finish calculating.':'Let’s work through it.');
 return '<section id="feedback" class="feedback '+(correct?'correct':'wrong')+'" tabindex="-1" aria-label="Answer explanation"><div class="feedback-heading"><span class="feedback-symbol" aria-hidden="true">'+(correct?icon('check',16):icon('bulb',16))+'</span><h2>'+title+'</h2></div><p>'+rich(fb.message||q.rule)+'</p>'+((q.kind==='number'||q.kind==='expression')?'<p class="worked-answer">'+(q.unit==='£'?math('£'+q.answer):math(q.answer)+(q.unit?' <span class="worked-unit">'+rich(q.unit)+'</span>':''))+'</p>':'')+(q.kind==='table'?tableFeedback(q,fb):'')+'<ol class="worked-list">'+(q.steps||[]).map(s=>'<li>'+rich(s)+'</li>').join('')+'</ol>'+(q.rule?'<p><strong>Remember:</strong> '+rich(q.rule)+'</p>':'')+(q.kind==='choice'?'<details><summary>Why the other answers do not fit</summary>'+q.options.filter(o=>o.id!==q.correctId).map(o=>'<p class="option-why"><strong>'+rich(o.text)+'</strong><br>'+rich(o.feedback)+'</p>').join('')+'</details>':'')+'<div class="next-box"><p class="next-note">'+esc(typeof fb.route==='string'?fb.route:fb.route?.reason||(correct&&!supported?'Your next question will build on this answer.':'The next question will practise this skill with a fresh calculation.'))+'</p><button class="button primary" data-action="next">Next question</button></div></section>';
}
function render(focus=false){$('#app').innerHTML=header()+(view==='practice'?practice():welcome());bind();if(focus){$('#question-heading')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
function bind(){
 const form=$('#question-form');if(form)form.addEventListener('submit',check);
 $('#expression-answer')?.addEventListener('input',e=>{draft=e.target.value;invalid='';});
 document.querySelectorAll('.table-input').forEach(el=>{
  el.addEventListener('focus',()=>{activeAnswerId=el.id;});
  el.addEventListener('input',()=>{tableDraft=state.current.table.columns.map((c,i)=>c.given?'':$('#table-answer-'+i)?.value||'');invalid='';});
 });
 document.querySelectorAll('input[name="choice"]').forEach(el=>el.addEventListener('change',e=>{selected=e.target.value;invalid='';}));
}
function check(e){
 e?.preventDefault();if(!state?.current||state.currentFeedback)return;const q=state.current;
 if(q.kind==='choice'&&!selected){invalid='Choose one answer, then press Check answer.';render();$('input[name="choice"]')?.focus();return;}
 if((q.kind==='number'||q.kind==='expression')&&!draft.trim()){invalid=q.kind==='expression'?'Type an nth-term rule using n, then press Check answer.':'Type your numerical answer, then press Check answer.';render();$('#expression-answer')?.focus();return;}
 if(q.kind==='table')tableDraft=q.table.columns.map((c,i)=>c.given?'':$('#table-answer-'+i)?.value||'');
 const fb=Adaptive.submit(state,{answer:draft,answers:tableDraft,choiceId:selected,hinted});
 if(fb.status==='invalid'){
  tableIssues=fb.cellResults||[];invalid=fb.message;render();
  if(q.kind==='table'){let index=(fb.cellResults||[]).findIndex(r=>r?.status==='invalid');if(index<0)index=q.table.columns.findIndex((c,i)=>!c.given&&!tableDraft[i]?.trim());if(index<0)index=q.table.columns.findIndex(c=>!c.given);$('#table-answer-'+index)?.focus();}else $('#expression-answer')?.focus();
  return;
 }
 invalid='';save();render();$('#feedback')?.focus({preventScroll:true});$('#feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function clearEntry(){selected='';draft='';tableDraft=[];tableIssues=[];activeAnswerId='';hinted=false;invalid='';}
function newQuestion(){Adaptive.advance(state);clearEntry();save();render(true);}
function start(){const vocation=$('#course-select')?.value||state?.vocation||Bank.vocations[0].id;if(!state)state=Adaptive.create({seed:(Date.now()^Math.floor(Math.random()*0x7fffffff))>>>0,vocation});else Adaptive.setVocation(state,vocation);Adaptive.next(state);view='practice';clearEntry();hinted=!!state.currentHinted||!!state.currentFeedback?.wasHinted;restoreNotice='';save();render(true);}
function panel(title,body){lastFocus=document.activeElement;$('#panel-content').innerHTML='<div class="panel-head"><h2 id="panel-title">'+esc(title)+'</h2><button class="icon-btn" data-action="close-panel" aria-label="Close '+esc(title)+'">'+icon('close')+'</button></div><div class="panel-body">'+body+'</div>';if(!$('#panel').open)$('#panel').showModal();$('#panel').scrollTop=0;}
function markSupported(){if(view==='practice'&&state?.current&&!state.currentFeedback){hinted=true;state.currentHinted=true;save();}}
function showWords(focusWord){markSupported();panel('The sequences word bank','<p class="panel-sub">A quick reference. Opening a hint or word definition records this check as supported practice.</p><div class="glossary-grid">'+glossary.map(g=>'<section class="glossary-item '+(g.word===focusWord?'is-focus':'')+'" id="word-'+g.word.toLowerCase().replace(/ /g,'-')+'"><h3>'+esc(g.word)+'</h3><p>'+esc(g.definition)+'</p>'+math(g.example)+'<p class="example-note">'+rich(g.note)+'</p></section>').join('')+'</div>');if(focusWord)$('#word-'+focusWord.toLowerCase().replace(/ /g,'-'))?.scrollIntoView({block:'center'});}
function showProgress(){const hs=history();const ss=state?.skills||{};panel('Your practice so far','<p class="panel-sub">Your route develops eleven sequence skills, from key words to nth-term reasoning. Secure understanding needs independent success on varied questions. These are practice indicators, not exam grades.</p><div class="progress-numbers"><div class="progress-number"><strong>'+hs.length+'</strong><span>checks completed</span></div><div class="progress-number"><strong>'+independentCount()+'</strong><span>correct unaided</span></div><div class="progress-number"><strong>'+hs.filter(supportedEntry).length+'</strong><span>with a hint or word bank</span></div></div><h3>Skills you have practised</h3>'+WorkshopConfig.skills.map(s=>{const evidence=hs.filter(h=>(h.skill||h.question?.skill)===s.id);const unaided=evidence.filter(h=>correctEntry(h)&&!supportedEntry(h)).length;const sk=ss[s.id]||{};const secure=sk.secure===true||sk.mastered===true;return '<div class="progress-row"><strong>'+esc(s.title)+'</strong><span class="status-pill '+(secure?'secure':'')+'">'+(secure?'Secure in this practice':evidence.length?'Building evidence':'To come')+'</span><span class="progress-detail">'+(evidence.length?unaided+' unaided successes in '+evidence.length+' checks':'Introduced after its starting skills')+'</span></div>';}).join('')+(hs.length?'<h3>Recent learning</h3>'+hs.slice(-8).reverse().map((h,i)=>{const q=h.question||{};const ok=correctEntry(h);return '<div class="log-entry"><h4>'+esc(skillName(h.skill||q.skill))+' · '+(ok?(supportedEntry(h)?'correct with support':'correct unaided'):'revisit')+'</h4>'+(q.expression?'<p>'+math(q.expression)+'</p>':'')+'<p class="history-values">'+rich(givenSummary(q))+'</p><p>'+rich(h.message||(typeof h.feedback==='string'?h.feedback:h.feedback?.message)||q.rule||'Your next question responds to this check.')+'</p></div>';}).join(''):'<p class="empty-note">Complete a question to start building your progress record.</p>')+'<div class="panel-actions"><button class="button secondary" data-action="csv">'+icon('download',16)+'Results CSV</button><button class="button secondary" data-action="backup">Save progress backup</button><button class="button secondary" data-action="import">Restore backup</button><button class="button secondary" data-action="print">Print summary</button></div><div class="panel-actions"><button class="hint-button" data-action="change-course">Change vocational area</button><button class="hint-button" data-action="reset">Start a fresh learner</button></div><p class="fineprint">Progress is saved in this browser when storage is available. No name is needed. On a shared device, start a fresh learner between students.</p>');}
function showTeacher(){
 panel('Teacher notes & Foundation scope',
 '<h3>What this activity covers</h3><p>Original vocational sequences practice aligned to Eduqas GCSE Mathematics Foundation, FA19–FA21. Students begin with sequence, term, position and rule definitions. They then continue arithmetic sequences, fill missing terms, use supplied nth-term rules, derive linear nth-term expressions and reason about positions and membership. Growing diagrams connect a pattern to its rule.</p><p>The later route includes triangular, square and cube numbers, Fibonacci-type sequences, quadratic patterns and simple geometric sequences with positive rational multiplying factors. Students may continue quadratic sequences or use a supplied quadratic nth-term rule. Finding a quadratic nth-term formula is outside this activity: derived nth-term expressions are linear throughout. Formal subscript recurrence notation is not used.</p><p>Positions begin at n = 1. Whenever a finite list is used to find a rule or extend a pattern, the intended rule type is stated. Physical item counts are whole numbers; fractional or signed terms use suitable quantities or models.</p>'+
 '<h3>How the questions adapt</h3><ul><li>An independent success adds another demand within the current skill. Success at one easy question does not mark the whole skill secure.</li><li>A wrong or unfinished answer leads to a fresh question on the same skill and relevant subtype. Known error patterns receive targeted explanations.</li><li>Repeated difficulty removes a demand. Independent recovery builds back up.</li><li>Opening a hint or word bank records supported practice. A fresh independent check follows before progression.</li><li>New skills depend on evidence for their starting skills. Earlier difficulties return after a gap.</li><li>Varied questions and two demanding independent successes are needed before a skill is secure. Different special-sequence types have their own evidence within the route.</li><li>After the route is secure, mixed practice remains within the Foundation boundary.</li><li>Mathematical signatures stop an identical task reappearing within one practice record. A different vocational setting does not make an old calculation new.</li></ul><p>The eleven strands use three internal demand levels. These are teaching decisions, not GCSE grades, and are not displayed as question-type banners. A record allows up to 600 checked questions and stops clearly if its fresh-question pool is exhausted.</p>'+
 '<h3>Answers and explanations</h3><p>Questions mix multiple choice, numerical answers, tables and typed linear nth-term rules. Every checked answer has worked steps. Incorrect choices explain why they do not fit. Numerical errors are matched to common misconceptions where possible; other errors receive the correct method without claiming to know the student’s thinking.</p><p>Equivalent linear rules are accepted, such as 3n + 2, 2 + 3n and 3(n − 1) + 5. The checker compares the complete algebraic rule, not just a few sample terms. Use n for the position. Numerical answers accept equivalent fractions, decimals and trailing zeros: 17, 17.0 and 17.00 are equal. Valid answers are checked exactly; no arbitrary tolerance is used.</p><p>Malformed or empty entries are not scored. For tables, every empty cell must contain a valid response before marking. Each missing value gets its own explanation, while the whole table counts as one practice check.</p>'+
 '<h3>Official sources</h3><ul class="source-list"><li><a href="https://www.eduqas.co.uk/media/cosjcbs1/eduqas-gcse-maths-spec-from-2015-e.pdf" target="_blank" rel="noopener">Eduqas GCSE Mathematics specification</a> — Foundation Sequences, printed page 9, FA19–FA21. Higher HA25 on page 18 confirms the distinction for quadratic nth-term derivation.</li><li><a href="https://resource.download.wjec.co.uk/vtc/2016-17/gft/eduqas/maths/GCSE%20Maths-GFT.pdf" target="_blank" rel="noopener">Official Guidance for Teaching</a> — Foundation Sequences, printed page 22, including supplied non-linear rules and the exclusion of formal subscript notation.</li></ul><p class="panel-sub">Independently created practice, not an official Eduqas product or a verbatim past-paper collection. Scope checked November 2026. This is a sequences activity, not a complete Foundation course.</p>'+
 '<h3>Classroom use and saved progress</h3><p>Choose one of sixteen vocational areas and start. Changing area keeps progress and applies to the next new question. The mathematical structure stays the same while the situation changes. The single HTML file works offline with no installation. Distribute it through your usual learning platform for students; the hosted copy is initially private to its owner.</p><p>No name is required. Progress stays in the current browser when storage is available. Download a progress backup to move between browsers. Use Start a fresh learner when another student takes over the device. Backups are specific to Sequences Workshop.</p><p>Results CSV, backup, restore and print controls are under Your progress. A hint or word-bank visit is recorded as support, so the app can check independent understanding next.</p><div class="panel-actions"><button class="button primary" data-action="download-app">'+icon('download',16)+'Download offline app</button><button class="button secondary" data-action="progress">View progress</button></div>');
}

function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function backup(){if(!state){toast('Start a practice first to save progress.');return;}download('sequences_progress.json',JSON.stringify({app:'Sequences Workshop',exportedAt:new Date().toISOString(),state},null,2),'application/json');toast('Progress backup prepared.');}
function csv(){const rows=[['Check','Vocational area','Skill','Question','Expression','Given values','Answer','Outcome','Support','Explanation']];history().forEach((h,i)=>{const q=h.question||{};const response=responseSummary(q,h);rows.push([i+1,vocationName(q.vocation||h.vocation||state.vocation),skillName(h.skill||q.skill),q.prompt||'',q.expression||'',givenSummary(q),response,correctEntry(h)?'Correct':h.outcome||h.status||'Revisit',supportedEntry(h)?'Supported':'Unaided',h.message||(typeof h.feedback==='string'?h.feedback:h.feedback?.message)||q.rule||'']);});const cell=x=>{let str=String(x??'');if(/^[=+@\t\r]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"';};download('sequences_results.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('Results CSV prepared.');}
function importBackup(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.hidden=true;document.body.append(input);input.addEventListener('cancel',()=>input.remove(),{once:true});input.addEventListener('change',async()=>{const file=input.files[0];input.remove();if(!file)return;if(file.size>12e6){toast('That backup is too large. Choose a Sequences Workshop backup.');return;}try{const data=JSON.parse(await file.text());const restored=Adaptive.restore(data.state||data);state=restored;restoreNotice='';view='welcome';clearEntry();save();$('#panel').close();render();toast('Progress restored. Choose Continue practice.');}catch(e){toast(/earlier|previous|version/i.test(String(e.message))?e.message+' Your current progress is unchanged.':'This is not a valid Sequences Workshop backup. Your current progress is unchanged.');}});input.click();}
function closePanel(){const open=$('#panel').open;if(open)$('#panel').close();if(view==='practice'&&state?.current&&!state.currentFeedback&&hinted)render();lastFocus?.focus?.();}
let offlineSource='';
document.addEventListener('click',e=>{const insert=e.target.closest('[data-insert]');if(insert){const input=state?.current?.kind==='table'?(document.getElementById(activeAnswerId)||document.querySelector('.table-input:not([readonly])')):$('#expression-answer');if(!input||input.disabled||input.readOnly)return;const text=insert.dataset.insert;const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.setRangeText(text,start,end,'end');if(input.dataset.tableIndex!==undefined)tableDraft=state.current.table.columns.map((c,i)=>c.given?'':$('#table-answer-'+i)?.value||'');else draft=input.value;input.focus();return;}const word=e.target.closest('[data-word]');if(word){showWords(word.dataset.word);return;}const btn=e.target.closest('[data-action]');if(!btn)return;switch(btn.dataset.action){case'start':start();break;case'next':newQuestion();break;case'home':view='welcome';save();render();break;case'theme':prefs.theme=prefs.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=prefs.theme;save();render();break;case'large':prefs.large=!prefs.large;document.documentElement.dataset.size=prefs.large?'large':'normal';save();render();break;case'hint':hinted=true;state.currentHinted=true;save();render();break;case'words':showWords();break;case'progress':showProgress();break;case'teacher':showTeacher();break;case'close-panel':closePanel();break;case'change-course':$('#panel').close();view='welcome';render();$('#course-select')?.focus();break;case'reset':confirmReset();break;case'do-reset':state=null;try{localStorage.removeItem(STORE);}catch(e){}view='welcome';clearEntry();$('#panel').close();render();toast('Ready for a fresh learner.');break;case'backup':backup();break;case'csv':csv();break;case'import':importBackup();break;case'print':window.print();break;case'download-app':download('sequences_workshop.html',offlineSource,'text/html;charset=utf-8');toast('Offline HTML prepared. Save it, then open it in your browser.');break;}});
$('#panel').addEventListener('click',e=>{if(e.target===$('#panel')){const r=$('#panel').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePanel();}});
$('#panel').addEventListener('cancel',()=>{if(view==='practice'&&hinted)requestAnimationFrame(()=>render());});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&state?.currentFeedback&&view==='practice'&&!$('#panel').open&&document.activeElement?.id==='feedback'){e.preventDefault();newQuestion();}});
function captureOfflineSource(){
 const html=document.createElement('html');html.lang='en-GB';
 const head=document.createElement('head'),body=document.createElement('body');
 for(const selector of ['meta[charset]','meta[name="viewport"]','meta[name="theme-color"]','meta[name="description"]','title','#app-styles']){
  const node=document.querySelector(selector);if(node)head.append(node.cloneNode(true));
 }
 for(const selector of ['.skip-link','#app','#toast','#panel','noscript']){
  const node=document.querySelector(selector);if(!node)continue;const copy=node.cloneNode(true);
  if(copy.id==='app'||copy.id==='toast')copy.textContent='';
  if(copy.id==='panel'){copy.removeAttribute('open');copy.innerHTML='<div id="panel-content"></div>';}
  body.append(copy);
 }
 for(const node of document.querySelectorAll('script[data-workshop-module]'))body.append(node.cloneNode(true));
 html.append(head,body);return '<!doctype html>\n'+html.outerHTML;
}
offlineSource=captureOfflineSource();
render();
})();
</script>
</body>
</html>
